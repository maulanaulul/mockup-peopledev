const merged=new Map();result.forEach(n=>{const key=n.employee+'-'+n.training;if(!merged.has(key))merged.set(key,{...n,sources:[n.source]});else{const old=merged.get(key);if(!old.sources.includes(n.source))old.sources.push(n.source);if(n.due&&(!old.due||n.due<old.due))old.due=n.due;if(n.type==='overdue')old.type='overdue'}});return [...merged.values()].filter(n=>emp(n.employee)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'))}

function upsertPosition(payload,id=null){const name=cleanName(payload.name);if(!name||name.length>120)throw Error('Isi nama posisi, maksimal 120 karakter.');if(data.positionMasters.some(p=>p.id!==id&&normalizedName(p.name)===normalizedName(name)))throw Error('Nama posisi sudah terdaftar, termasuk posisi nonaktif.');let p=data.positionMasters.find(p=>p.id===id);if(id&&!p)throw Error('Posisi tidak ditemukan.');if(p){const previous=p.name;p.name=name;p.active=Boolean(payload.active);if(previous!==name){data.employees.forEach(e=>{if(e.position===previous)e.position=name});data.rules.forEach(r=>{if(r.position===previous)r.position=name});data.siteRules.forEach(r=>{if(r.position===previous)r.position=name;if(r.positions)r.positions=r.positions.map(n=>n===previous?name:n)})}}else{p={id:'pos-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),name,active:Boolean(payload.active)};data.positionMasters.push(p)}syncMasters();return p}
function savePositionMaster(id,fromMapping){try{const f=new FormData(document.getElementById('positionMasterForm')),p=upsertPosition({name:f.get('name'),active:fromMapping||f.get('active')==='on'},id||null);save();render();if(fromMapping)resumeMapping('position',p.name);else closeModal();toast('Posisi tersimpan.')}catch(e){toast(e.message)}}
function trainingMasterForm(id=null,fromMapping=false){const t=trainings.find(t=>t.id===id);showModal(t?'Edit training / sertifikasi':'Tambah training / sertifikasi',`<p>Atur masa berlaku dan kebutuhan penyegaran. Tanggal pada dokumen asli tetap menjadi acuan saat hasil training dicatat.</p><form id="trainingMasterForm" onsubmit="event.preventDefault();saveTrainingMaster('${id||''}',${fromMapping})"><div class="form-grid"><div class="field" style="grid-column:1/-1"><label for="trainingName">Nama training / sertifikasi</label><input id="trainingName" name="name" maxlength="160" required value="${esc(t?.name||'')}" placeholder="Contoh: Pelatihan Leadership"></div><div class="field"><label for="trainingCode">Kode (opsional)</label><input id="trainingCode" name="code" maxlength="60" value="${esc(t?.code||'')}" placeholder="Contoh: TRN-LDR-01"></div><div class="field"><label for="trainingKind">Jenis</label><select id="trainingKind" name="kind"><option value="training" ${t?.kind==='training'?'selected':''}>Training</option><option value="certification" ${t?.kind==='certification'?'selected':''}>Sertifikasi</option></select></div><div class="field"><label for="trainingExpiry">Masa berlaku</label><select id="trainingExpiry" name="expiryMode" onchange="toggleValidityFields()"><option value="fixed" ${t?.expiryMode!=='none'?'selected':''}>Memiliki masa berlaku</option><option value="none" ${t?.expiryMode==='none'?'selected':''}>Tidak kedaluwarsa</option></select></div><div class="field"><label for="validityMonths">Durasi masa berlaku (bulan)</label><input id="validityMonths" name="validityMonths" type="number" min="1" max="1200" step="1" ${t?.expiryMode==='none'?'disabled':'required'} value="${t?.validityMonths??36}"><small style="font-size:10px;color:#8c9a83">Contoh: 36 bulan = 3 tahun</small></div><div class="field"><label for="refresherMonths">Penyegaran berkala (bulan, opsional)</label><input id="refresherMonths" name="refresherMonths" type="number" min="1" max="1200" step="1" value="${t?.refresherMonths||''}" placeholder="Kosongkan jika tidak berkala"><small style="font-size:10px;color:#8c9a83">Training tanpa kedaluwarsa tetap dapat dijadwalkan untuk penyegaran.</small></div><div class="field"><label for="trainingDescription">Keterangan (opsional)</label><input id="trainingDescription" name="desc" maxlength="300" value="${esc(t?.desc||'')}"></div></div>${fromMapping?'':`<label style="display:flex;gap:10px;align-items:center;margin:20px 0;font-size:12px"><input type="checkbox" name="active" ${!t||t.active?'checked':''}> Training aktif</label>`}<div class="actions" style="justify-content:flex-end;margin-top:24px"><button class="btn" type="button" onclick="${fromMapping?'resumeMapping()':'closeModal()'}">${fromMapping?'Kembali ke mapping':'Batal'}</button><button type="submit" class="btn primary">Simpan training</button></div></form>`)}
function toggleValidityFields(){const none=document.getElementById('trainingExpiry').value==='none',input=document.getElementById('validityMonths');input.disabled=none;input.required=!none}
function upsertTraining(payload,id=null){const name=cleanName(payload.name),code=cleanName(payload.code);if(!name||name.length>160)throw Error('Isi nama training, maksimal 160 karakter.');if(trainings.some(t=>t.id!==id&&normalizedName(t.name)===normalizedName(name)))throw Error('Nama training sudah terdaftar, termasuk training nonaktif.');if(code&&trainings.some(t=>t.id!==id&&normalizedName(t.code)===normalizedName(code)))throw Error('Kode training sudah digunakan.');if(!['training','certification'].includes(payload.kind)||!['fixed','none'].includes(payload.expiryMode))throw Error('Pilih jenis dan masa berlaku training.');const validity=payload.expiryMode==='fixed'?Number(payload.validityMonths):null,refresher=payload.refresherMonths?Number(payload.refresherMonths):null;if(payload.expiryMode==='fixed'&&(!Number.isInteger(validity)||validity<1||validity>1200))throw Error('Masa berlaku harus 1–1200 bulan.');if(refresher!==null&&(!Number.isInteger(refresher)||refresher<1||refresher>1200))throw Error('Interval penyegaran harus 1–1200 bulan.');let t=trainings.find(t=>t.id===id);if(id&&!t)throw Error('Training tidak ditemukan.');const fields={name,code,desc:String(payload.desc||'').trim().slice(0,300),kind:payload.kind,expiryMode:payload.expiryMode,validityMonths:validity,years:validity?validity/12:null,refresherMonths:refresher,active:Boolean(payload.active)};if(t)Object.assign(t,fields);else{t={id:'trn-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),...fields};data.trainingMasters.push(t)}syncMasters();return t}
function saveTrainingMaster(id,fromMapping){try{const f=new FormData(document.getElementById('trainingMasterForm')),t=upsertTraining({name:f.get('name'),code:f.get('code'),desc:f.get('desc'),kind:f.get('kind'),expiryMode:f.get('expiryMode'),validityMonths:f.get('validityMonths'),refresherMonths:f.get('refresherMonths'),active:fromMapping||f.get('active')==='on'},id||null);save();render();if(fromMapping)resumeMapping('training',t.id);else closeModal();toast('Training tersimpan. Tanggal sertifikat lama tetap dipertahankan.')}catch(e){toast(e.message)}}
function toggleMaster(kind,id){const record=(kind==='position'?data.positionMasters:trainings).find(x=>x.id===id);if(!record)return;record.active=!record.active;syncMasters();save();render();toast(record.active?'Item diaktifkan kembali.':'Item dinonaktifkan. Riwayat, mapping, dan rencana yang sudah ada tetap tersimpan.')}

function positionMappingBody(){return `<div class="rule-note">${icon('map',17)}  Sertifikasi tetap wajib dipertahankan aktif.</div><div class="mapping-grid">${positions.filter(p=>data.rules.some(r=>r.position===p)).map(p=>`<section class="card mapping-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3>${esc(p)}</h3><span class="metric-icon">${icon('users',16)}</span></div><p>${data.employees.filter(e=>e.position===p).length} karyawan · ${data.rules.filter(r=>r.position===p).length} aturan sertifikasi</p>${data.rules.filter(r=>r.position===p).sort((a,b)=>a.start-b.start).map(r=>`<div class="mapping-rule"><div class="range">${r.end===null?'Belum diatur':r.start+'–'+r.end+' tahun'}</div><div style="flex:1"><strong>${esc(tr(r.training).name)}</strong><small>${r.end===null?'Batas penyelesaian belum diatur':'Mulai tahun ke-'+r.start+' · selesai maksimal tahun ke-'+r.end}</small><small>Wajib dipertahankan aktif</small></div><button class="icon-button" style="width:28px;height:28px" aria-label="Edit aturan ${esc(tr(r.training).name)}" onclick="ruleForm(${r.id})">${icon('edit',13)}</button></div>`).join('')}</section>`).join('')}</div>`}
function mappingPage(){const mandatory=mappingTab==='mandatory';return heading('MAPPING KEBUTUHAN','Mapping & aturan','Atur kebutuhan sertifikasi berdasarkan posisi dan minimum personel per site.',`<button class="btn" onclick="navigate('positions')">Master posisi</button><button class="btn" onclick="navigate('trainingMaster')">Master training</button><button class="btn primary" onclick="${mandatory?'siteRuleForm()':'ruleForm()'}">${icon('plus',14)} ${mandatory?'Tambah aturan mandatory':'Tambah mapping posisi'}</button>`)+`<div class="card" style="margin-bottom:20px"><div class="table-tools" style="border-bottom:0"><div class="tabs" role="tablist" aria-label="Jenis mapping"><button role="tab" aria-selected="${!mandatory}" class="${!mandatory?'active':''}" onclick="mappingTab='position';render()">Mapping Posisi <span class="master-count">${data.rules.length}</span></button><button role="tab" aria-selected="${mandatory}" class="${mandatory?'active':''}" onclick="mappingTab='mandatory';render()">Mandatory Site <span class="master-count">${siteRules.length}</span></button></div></div></div>${mandatory?mandatoryMappingBody():positionMappingBody()}`}
function openMandatory(){mappingTab='mandatory';navigate('mapping')}
function mandatoryMappingBody(){const active=siteRules.filter(r=>r.active!==false),minimum=sites.reduce((sum,s)=>sum+rulesForSite(s.id).reduce((a,r)=>a+r.minimum,0),0);return `<div class="rule-note">${icon('shield',17)} Mandatory site berlaku tanpa menunggu masa kerja. Sistem memilih kandidat paling senior dari posisi yang ditetapkan. Personel yang sudah memiliki sertifikat valid dan terverifikasi dihitung terlebih dahulu.</div><div class="metrics" style="grid-template-columns:repeat(3,minmax(0,1fr))">${metric('Aturan aktif',active.length,'Dari '+siteRules.length+' aturan tersimpan','shield')}${metric('Cakupan site',sites.filter(s=>rulesForSite(s.id).length).length,'Site dengan aturan mandatory aktif','site')}${metric('Minimum penempatan',minimum,'Jumlah kebutuhan personel per sertifikasi dan site','users')}</div><section class="card"><div class="card-head" style="padding-bottom:20px"><div><h2>Daftar sertifikasi mandatory</h2><p>Aturan site tertentu menggantikan aturan umum untuk sertifikasi yang sama.</p></div><button class="arrow-link" onclick="navigate('sites')">Lihat kepatuhan site ${icon('arrow',13)}</button></div><div class="table-wrap"><table><thead><tr><th>Sertifikasi / training</th><th>Cakupan site</th><th>Minimum personel</th><th>Posisi kandidat</th><th>Status</th><th>Tindakan</th></tr></thead><tbody>${siteRules.map(r=>`<tr class="${r.active===false?'inactive-row':''}"><td style="white-space:normal;min-width:170px"><strong>${esc(tr(r.training)?.name||r.training)}</strong><small style="display:block;font-size:9px;margin-top:5px">${esc(tr(r.training)?.code||'')}</small></td><td>${r.site?esc(siteName(r.site)):'Semua site'}</td><td>${r.minimum} orang / site</td><td style="white-space:normal;min-width:200px;max-width:320px;font-size:10px;line-height:1.8">${(r.positions||[r.position]).map(esc).join('<br>')}</td><td>${activeBadge(r.active!==false)}</td><td><div class="actions"><button class="btn small" onclick="siteRuleForm('${r.id}')">${icon('edit',12)} Edit</button><button class="arrow-link" onclick="toggleSiteRule('${r.id}')">${r.active===false?'Aktifkan':'Nonaktifkan'}</button></div></td></tr>`).join('')}</tbody></table>${siteRules.length?'':'<div class="empty">Belum ada aturan mandatory. Tambahkan sertifikasi dan minimum personel yang dibutuhkan.</div>'}</div><div class="table-footer"><span>Aturan nonaktif tetap tersimpan.</span><span>Generate ulang plan untuk menambahkan kebutuhan terbaru.</span></div></section>`}
function siteRuleForm(id=null){const rule=siteRules.find(r=>r.id===id),candidates=rule?.positions||[rule?.position].filter(Boolean),options=data.positionMasters.filter(p=>p.active||candidates.includes(p.name));showModal(rule?'Edit aturan mandatory site':'Tambah aturan mandatory site',`<p>Tentukan kualifikasi yang wajib tersedia pada site dan posisi yang dapat menjadi kandidat. Persyaratan program tetap diperiksa sebelum peserta dijadwalkan.</p><form id="siteRuleForm" onsubmit="event.preventDefault();saveSiteRule('${id||''}')"><div class="form-grid"><div class="field"><label for="mandatoryScope">Cakupan site</label><select id="mandatoryScope" name="site"><option value="*">Semua site</option>${sites.map(s=>`<option value="${esc(s.id)}" ${rule?.site===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label for="mandatoryTraining">Sertifikasi / training wajib</label><select id="mandatoryTraining" name="training" required>${selectableTrainings(rule?.training).map(t=>`<option value="${t.id}" ${t.id===rule?.training?'selected':''}>${esc(t.name)}${t.active?'':' (nonaktif)'}</option>`).join('')}</select></div><div class="field"><label for="mandatoryMinimum">Minimum personel per site</label><input id="mandatoryMinimum" name="minimum" type="number" min="1" max="1000" step="1" required value="${rule?.minimum||1}"></div><div class="field"><label for="mandatoryPriority">Prioritas kandidat</label><input id="mandatoryPriority" value="Masa kerja paling lama sejak masuk perusahaan" readonly></div></div><div class="field" style="margin-top:20px"><label for="mandatoryPositionSearch">Posisi kandidat (boleh lebih dari satu)</label><input id="mandatoryPositionSearch" type="search" placeholder="Cari posisi…" oninput="filterCandidatePositions(this.value)"><div class="candidate-picker"><div class="candidate-selection-tools"><label for="mandatorySelectResults"><input id="mandatorySelectResults" type="checkbox" aria-label="Pilih semua hasil pencarian" onchange="setCandidateResults(this.checked)">Pilih semua hasil</label><button type="button" id="mandatoryClearResults" class="arrow-link" onclick="setCandidateResults(false)">Batalkan pilihan hasil</button></div><div id="mandatoryPositions" class="candidate-results-list">${options.map(p=>`<label class="candidate-position-option"><input type="checkbox" name="positions" value="${esc(p.id)}" ${candidates.includes(p.name)?'checked':''}><span>${esc(p.name)}${p.active?'':' (nonaktif)'}</span></label>`).join('')}<div id="mandatoryNoResults" class="candidate-result-empty" hidden>Tidak ada posisi yang sesuai pencarian.</div></div></div><div class="candidate-result-summary"><span id="mandatoryResultsCount" aria-live="polite"></span><span>Pilih semua hanya berlaku pada hasil pencarian.</span></div><small style="font-size:10px;color:#8b9a80">Posisi terpilih: <span id="mandatorySelectedCount">${candidates.length}</span>. Pemegang sertifikat valid di site dihitung tanpa membatasi posisi.</small></div><label style="display:flex;align-items:center;gap:9px;margin-top:20px;font-size:12px;color:#657e5b"><input type="checkbox" name="active" ${rule?.active===false?'':'checked'}> Aturan aktif</label><div class="rule-note" style="margin-top:18px">Aturan khusus site menggantikan aturan umum untuk sertifikasi yang sama. Jika aturan khusus dinonaktifkan, aturan umum yang aktif tetap berlaku.</div><div class="actions" style="justify-content:flex-end;margin-top:20px"><button type="button" class="btn" onclick="closeModal()">Batal</button><button type="submit" class="btn primary">Simpan aturan mandatory</button></div></form>`);document.getElementById('mandatoryPositions').addEventListener('change',refreshCandidateSelection);refreshCandidateSelection()}
function candidateOptions(){return [...document.getElementById('mandatoryPositions').querySelectorAll('.candidate-position-option')]}
function filterCandidatePositions(value){const q=normalizedName(value);candidateOptions().forEach(option=>{option.hidden=!normalizedName(option.textContent).includes(q)});document.getElementById('mandatoryPositions').scrollTop=0;refreshCandidateSelection()}
function refreshCandidateSelection(){const all=candidateOptions(),visible=all.filter(option=>!option.hidden),selectedVisible=visible.filter(option=>option.querySelector('input').checked).length,total=all.filter(option=>option.querySelector('input').checked).length,selectAll=document.getElementById('mandatorySelectResults');selectAll.checked=visible.length>0&&selectedVisible===visible.length;selectAll.indeterminate=selectedVisible>0&&selectedVisible<visible.length;selectAll.disabled=visible.length===0;document.getElementById('mandatoryClearResults').disabled=selectedVisible===0;document.getElementById('mandatorySelectedCount').textContent=total;document.getElementById('mandatoryResultsCount').textContent=visible.length+' hasil · '+selectedVisible+' dipilih';document.getElementById('mandatoryNoResults').hidden=visible.length>0}
function setCandidateResults(checked){candidateOptions().filter(option=>!option.hidden).forEach(option=>{option.querySelector('input').checked=Boolean(checked)});refreshCandidateSelection()}
function upsertSiteRule(payload,id=null){const existing=siteRules.find(r=>r.id===id);if(id&&!existing)throw Error('Aturan tidak ditemukan.');const site=payload.site==='*'?null:payload.site;if(site&&!sites.some(s=>s.id===site))throw Error('Pilih site yang tersedia.');const training=tr(payload.training);if(!training||(!training.active&&existing?.training!==training.id))throw Error('Pilih training aktif.');const minimum=Number(payload.minimum);if(!Number.isInteger(minimum)||minimum<1||minimum>1000)throw Error('Minimum personel harus bilangan bulat 1–1000.');const ids=[...new Set(payload.positionIds||[])];if(!ids.length)throw Error('Pilih minimal satu posisi kandidat.');const selected=ids.map(id=>data.positionMasters.find(p=>p.id===id));if(selected.some(p=>!p||(!p.active&&!(existing?.positions||[existing?.position]).includes(p.name))))throw Error('Pilih posisi kandidat yang aktif.');if(siteRules.some(r=>r.id!==id&&(r.site||null)===(site||null)&&r.training===training.id))throw Error('Aturan untuk site dan sertifikasi ini sudah ada. Gunakan Edit pada aturan yang tersedia.');const fields={site,training:training.id,minimum,positions:selected.map(p=>p.name),position:'Posisi sesuai mapping',active:Boolean(payload.active)};let result;if(existing){Object.assign(existing,fields);result=existing}else{result={id:makeId('site-rule'),...fields};data.siteRules.push(result)}syncMasters();return result}
function saveSiteRule(id){try{const f=new FormData(document.getElementById('siteRuleForm'));upsertSiteRule({site:f.get('site'),training:f.get('training'),minimum:f.get('minimum'),positionIds:f.getAll('positions'),active:f.get('active')==='on'},id||null);save();closeModal();mappingTab='mandatory';render();toast('Aturan mandatory tersimpan. Kepatuhan site dan alert diperbarui.')}catch(e){toast(e.message)}}
function toggleSiteRule(id){const rule=siteRules.find(r=>r.id===id);if(!rule)return;rule.active=rule.active===false;save();render();toast(rule.active?'Aturan mandatory diaktifkan.':'Aturan dinonaktifkan. Aturan umum lain yang aktif tetap berlaku; riwayat plan tetap tersimpan.')}

function sitesPage(){const sc=sites.filter(s=>siteFilter==='all'||s.id===siteFilter);return heading('PEMENUHAN PER SITE','Kepatuhan site','Pastikan setiap lokasi memiliki personel dengan kualifikasi yang dibutuhkan.',`${siteSelect()}<button class="btn primary" onclick="openMandatory()">${icon('settings',14)} Atur mandatory</button>`)+`<div class="rule-note">${icon('shield',17)} Jumlah minimum mengikuti aturan mandatory site.</div><div class="site-grid">${sc.map(s=>{const configured=rulesForSite(s.id).length>0,compliant=configured&&rulesForSite(s.id).every(r=>!getCoverage(s.id,r).gap);return `<section class="card site-card"><div class="site-title"><div><span class="metric-icon" style="display:inline-grid">${icon('site',17)}</span><h3>${esc(s.name)}</h3><p style="font-size:10px;color:#9ba693;margin-top:10px">${esc(s.region)} · ${data.employees.filter(e=>e.site===s.id).length} karyawan</p></div>${pill(configured?(compliant?'active':'expired'):'optional',configured?(compliant?'Terpenuhi':'Ada gap'):'Belum diatur')}</div>${!configured?'<div class="empty" style="padding:20px 0">Belum ada aturan mandatory aktif untuk site ini.</div>':''}${rulesForSite(s.id).map(r=>{const c=getCoverage(s.id,r);return `<div class="site-rule"><div class="row"><strong>${esc(tr(r.training).name)}</strong><span>${c.people.length} / ${r.minimum} orang</span></div><div class="progress"><span style="width:${Math.min(100,c.people.length/r.minimum*100)}%;background:${c.gap?'#dba56a':'#4a9273'}"></span></div><small>${c.gap?'Kekurangan '+c.gap+' personel berkualifikasi':c.people.map(e=>esc(e.name)).join(', ')}</small>${c.gap?`<button class="arrow-link" onclick="candidateDetail('${s.id}','${r.training}')">Lihat kandidat prioritas ${icon('arrow',12)}</button>`:''}</div>`}).join('')}</section>`}).join('')}</div>`}
function planPage(){const list=data.plans.filter(p=>p.year===planYear&&emp(p.employee)&&(siteFilter==='all'||emp(p.employee).site===siteFilter)),done=list.filter(p=>p.status==='completed').length;return heading('RENCANA TAHUNAN','Rencana training','Daftar pelatihan berdasarkan mapping posisi, kebutuhan site, dan perpanjangan.',`<select aria-label="Tahun rencana" onchange="planYear=Number(this.value);render()">${[2026,2027,2028].map(y=>`<option ${planYear===y?'selected':''}>${y}</option>`).join('')}</select>${siteSelect()}<button class="btn primary" onclick="generatePlan()">${icon('spark',14)} Generate plan</button>`)+`<div class="banner-slim"><div><strong>Rencana pelatihan ${planYear}</strong><p>Mapping masa kerja + mandatory site + perpanjangan H-6 bulan. Satu orang, satu training, satu kebutuhan gabungan.</p></div><button class="btn small" onclick="downloadWorkbook(['RencanaTraining'])">${icon('download',13)} Export Excel</button></div><div class="metrics">${metric('Total rencana',list.length,'Kebutuhan unik dalam tahun '+planYear,'calendar')}${metric('Outstanding',list.filter(p=>p.status==='outstanding').length,'Belum dijadwalkan','clock','warn')}${metric('Dijadwalkan',list.filter(p=>p.status==='planned').length,'Menunggu pelaksanaan / verifikasi','calendar')}${metric('Selesai',done,'Bukti kualifikasi telah diverifikasi','check')}</div><section class="card"><div class="card-head" style="padding-bottom:20px"><div><h2>Daftar rencana training</h2><p>Baseline tetap tersimpan. Generate berikutnya menambahkan kebutuhan baru.</p></div><span class="ring-mini">${icon('calendar',13)} FY ${planYear}</span></div><div class="table-wrap"><table><thead><tr><th>Karyawan</th><th>Training</th><th>Dasar kebutuhan</th><th>Target bulan</th><th>Status</th><th>Tindak lanjut</th></tr></thead><tbody>${list.map(p=>`<tr><td>${person(emp(p.employee))}</td><td><strong>${esc(tr(p.training).name)}</strong><small style="display:block;margin-top:5px;font-size:9px">${esc(siteName(emp(p.employee).site))}</small></td><td>${p.sources.map(s=>`<div style="margin:3px 0">${esc(s)}</div>`).join('')}</td><td><input type="month" aria-label="Target bulan ${esc(emp(p.employee).name)} ${esc(tr(p.training).name)}" value="${esc(p.target)}" min="${planYear}-01" max="${planYear}-12" style="border:1px solid #e3e9df;padding:7px;border-radius:6px;font-size:10px;color:#64795e;width:131px" onchange="changeTarget('${p.id}',this.value)"></td><td>${pill(p.status)}</td><td>${p.status==='completed'?'<span style="color:#5e9170;font-size:10px">'+icon('check',12)+' Terverifikasi</span>':`<button class="arrow-link" onclick="${p.status==='outstanding'?`schedulePlan('${p.id}')`:`certForm('${p.employee}','${p.training}','${p.id}')`}">${p.status==='outstanding'?'Jadwalkan':'Verifikasi hasil'} ${icon('arrow',12)}</button>`}</td></tr>`).join('')}</tbody></table>${!list.length?`<div class="empty">${icon('calendar',35)}<h3 style="margin:15px 0 8px;color:#526e50">Rencana ${planYear} belum dibuat</h3><p style="margin-bottom:18px">Generate untuk melihat siapa yang perlu training dan apa kebutuhannya.</p><button class="btn primary" onclick="generatePlan()">${icon('spark',14)} Generate plan ${planYear}</button></div>`:''}</div></section>`}
function alertsPage(){const needs=currentNeeds();return heading('TINDAK LANJUT','Pusat alert','Kebutuhan yang terdeteksi otomatis, dengan langkah tindak lanjut yang jelas.',`${siteSelect()}<button class="btn primary" onclick="navigate('plan')">Buka rencana training ${icon('arrow',14)}</button>`)+`<div class="rule-note">${icon('clock',17)} Tanggal acuan: 22 Oktober 2026. Almost expired sejak H-6 bulan; overdue mengikuti batas penyelesaian kewajiban.</div><section class="card"><div class="card-head" style="padding-bottom:20px"><div><h2>${needs.length} kebutuhan memerlukan tindak lanjut</h2><p>Alert terselesaikan setelah persyaratan terpenuhi, bukan setelah rencana dibuat.</p></div></div>${needs.map(n=>{const e=emp(n.employee);return `<div class="alert-item"><span class="metric-icon ${n.type==='overdue'?'red':'teal'}">${icon(n.type==='overdue'?'alert':'clock',18)}</span><div class="alert-copy"><h3>${esc(tr(n.training).name)} · ${esc(e.name)}</h3><p>${esc(siteName(e.site))} · ${esc(n.sources.join(' + '))}<br>Batas kebutuhan ${fmt(n.due)}${n.sources.includes('Mandatory site')?' · Diprioritaskan berdasarkan senioritas':''}</p></div>${pill(n.type)}<button class="btn small" onclick="employeeDetail('${e.id}')">Tinjau ${icon('arrow',12)}</button></div>`}).join('')||'<div class="empty">Seluruh kebutuhan pada filter ini sudah terpenuhi.</div>'}</section>`}
function showModal(title,body,foot=''){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="icon-button" aria-label="Tutup dialog" onclick="closeModal()">${icon('close',16)}</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</section></div>`;document.body.style.overflow='hidden';requestAnimationFrame(()=>document.querySelector('.modal button,.modal input,.modal select')?.focus())}
function closeModal(){if(mappingDraft){resumeMapping();return}document.getElementById('modalRoot').innerHTML='';document.body.style.overflow=''}
function employeeDetail(id){const e=emp(id),certs=data.certs.filter(c=>c.employee===id&&latestCert(id,c.training)?.id===c.id),needs=getNeeds().filter(n=>n.employee===id);showModal('Profil karyawan',`<div style="margin-bottom:24px">${person(e)}</div><div class="detail-grid"><div><span>Site resmi</span><strong>${siteName(e.site)}</strong></div><div><span>Posisi</span><strong>${esc(e.position)}</strong></div><div><span>Tanggal masuk perusahaan</span><strong>${fmt(e.joined)}</strong></div><div><span>Masa kerja</span><strong>${tenure(e)} tahun</strong></div></div><h3 style="margin-bottom:12px">Sertifikasi tercatat</h3>${certs.map(c=>`<div class="switch-row"><div><strong style="font-size:12px">${esc(tr(c.training).name)}</strong><small>Berlaku sampai ${c.expires?fmt(c.expires):'Tidak kedaluwarsa'}</small></div>${pill(certStatus(c))}</div>`).join('')||'<p style="font-size:12px;color:#99a38f">Belum ada riwayat tercatat.</p>'}<h3 style="margin:24px 0 10px">Kebutuhan outstanding</h3>${needs.map(n=>`<div class="switch-row"><div><strong style="font-size:12px">${esc(tr(n.training).name)}</strong><small>${n.sources.join(' + ')} · ${fmt(n.due)}</small></div>${pill(n.type)}</div>`).join('')||'<p style="font-size:12px;color:#7b9472">Tidak ada kebutuhan saat ini.</p>'}`,`<button class="btn" onclick="closeModal()">Tutup</button><button class="btn primary" onclick="certForm('${id}')">${icon('plus',14)} Catat sertifikat</button>`)}
function candidateDetail(site,training){const rule=rulesForSite(site).find(r=>r.training===training),c=getCoverage(site,rule);showModal('Kandidat mandatory site',`<p>${esc(siteName(site))} membutuhkan ${rule.minimum} personel dengan ${esc(tr(training).name)}. Kandidat diurutkan dari tanggal masuk paling awal. Pastikan sertifikat yang sudah dimiliki diverifikasi sebelum menetapkan training baru.</p>${c.candidates.map((e,i)=>`<div class="switch-row"><div>${person(e)}<small>Masuk ${fmt(e.joined)} · ${tenure(e)} tahun</small></div>${pill(i<c.gap?'active':'optional',i<c.gap?'Prioritas '+(i+1):'Cadangan')}</div>`).join('')||'<div class="empty">Tidak ada kandidat dengan posisi yang dipetakan.</div>'}<div class="rule-note" style="margin-top:20px">Rekomendasi berdasarkan posisi dan senioritas. PIC HO perlu memeriksa prasyarat program sebelum menjadwalkan.</div>`,`<button class="btn" onclick="closeModal()">Tutup</button><button class="btn primary" onclick="closeModal();navigate('plan')">Ke rencana training ${icon('arrow',13)}</button>`)}
function ruleForm(id,draft=null){const r=draft||data.rules.find(r=>r.id===id)||{};showModal(id?'Edit mapping posisi':'Tambah mapping posisi',`<p>Tentukan awal kewajiban dan batas penyelesaian training. Sertifikasi tetap wajib dipertahankan aktif.</p><form id="ruleForm" onsubmit="event.preventDefault();saveRule(${id||0})"><div class="form-grid"><div class="field"><label for="mappingPosition">Posisi</label><select id="mappingPosition" name="position" required>${selectablePositions(r.position).map(p=>`<option value="${esc(p.name)}" ${r.position===p.name?'selected':''}>${esc(p.name)}${p.active?'':' (nonaktif)'}</option>`).join('')}</select><button type="button" class="arrow-link" onclick="openMasterFromMapping('position',${id||0})">${icon('plus',12)} Tambah posisi baru</button></div><div class="field"><label for="mappingTraining">Training / sertifikasi</label><select id="mappingTraining" name="training" required>${selectableTrainings(r.training).map(t=>`<option value="${t.id}" ${r.training===t.id?'selected':''}>${esc(t.name)}${t.active?'':' (nonaktif)'}</option>`).join('')}</select><button type="button" class="arrow-link" onclick="openMasterFromMapping('training',${id||0})">${icon('plus',12)} Tambah training baru</button></div><div class="field"><label for="mappingStart">Mulai pada masa kerja (tahun)</label><input id="mappingStart" name="start" type="number" step="1" min="0" max="50" required value="${esc(r.start??0)}"></div><div class="field"><label for="mappingEnd">Batas selesai (tahun)</label><input id="mappingEnd" name="end" type="number" step="1" min="1" max="60" required placeholder="Contoh: 3" value="${esc(r.end??'')}"></div></div><button type="submit" class="btn primary" style="margin-top:24px">Simpan mapping</button></form>`)}
function openMasterFromMapping(kind,id){const f=new FormData(document.getElementById('ruleForm'));mappingDraft={id:id||0,position:f.get('position'),training:f.get('training'),start:f.get('start'),end:f.get('end')};if(kind==='position')positionForm(null,true);else trainingMasterForm(null,true)}
function resumeMapping(kind,value){if(!mappingDraft){closeModal();return}const draft={...mappingDraft};if(kind)draft[kind]=value;mappingDraft=null;ruleForm(draft.id,draft)}
function saveRule(id){const f=new FormData(document.getElementById('ruleForm'));const r={id:id||Date.now(),position:f.get('position'),training:f.get('training'),start:Number(f.get('start')),end:Number(f.get('end')),timingConfigured:true};if(!Number.isInteger(r.start)||r.start<0||!Number.isInteger(r.end)||r.end>60||r.end<=r.start)return toast('Batas selesai harus lebih besar dari awal kewajiban.');const old=data.rules.find(x=>x.id===id);if(!data.positionMasters.some(p=>p.name===r.position&&(p.active||old?.position===p.name))||!trainings.some(t=>t.id===r.training&&(t.active||old?.training===t.id)))return toast('Pilih posisi dan training aktif.');if(data.rules.some(x=>x.id!==id&&x.position===r.position&&x.training===r.training))return toast('Mapping posisi dan sertifikasi ini sudah ada. Edit aturan yang tersedia.');if(id)data.rules=data.rules.map(x=>x.id===id?r:x);else data.rules.push(r);save();closeModal();render();toast('Mapping tersimpan. Kebutuhan dihitung ulang.')}
function addEmployee(){showModal('Tambah karyawan',`<form id="employeeForm" onsubmit="event.preventDefault();saveEmployee()"><div class="form-grid"><div class="field"><label>Nama lengkap</label><input name="name" required maxlength="70" placeholder="Nama lengkap karyawan"></div><div class="field"><label>Tanggal masuk perusahaan</label><input name="joined" type="date" required max="${reference}"></div><div class="field"><label>Posisi</label><select name="position">${selectablePositions().map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Site resmi</label><select name="site">${sites.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div></div><p style="font-size:11px;color:#96a18e;margin-top:17px">Isi sesuai data karyawan yang berlaku.</p><button class="btn primary" style="margin-top:20px">Simpan karyawan</button></form>`)}
function saveEmployee(){const f=new FormData(document.getElementById('employeeForm'));if(!String(f.get('name')).trim()||parseDate(f.get('joined'))>today)return toast('Periksa nama dan tanggal masuk.');if(!data.positionMasters.some(p=>p.active&&p.name===f.get('position')))return toast('Pilih posisi aktif.');data.employees.push({id:'DM'+String(Date.now()).slice(-7),name:String(f.get('name')).trim(),joined:f.get('joined'),position:f.get('position'),site:f.get('site')});save();closeModal();render();toast('Karyawan ditambahkan.')}
function certForm(employee='',training='',planId=''){const current=employee&&training?latestCert(employee,training):null;const selected=tr(training)||selectableTrainings()[0];showModal('Verifikasi / perbarui hasil training',`<p>Periksa bukti dan tanggal pada dokumen asli sebelum menyimpan hasil verifikasi. Tanggal impor dari Excel masih berupa perkiraan.</p><form id="certForm" onsubmit="event.preventDefault();saveCertificate('${planId}')"><div class="form-grid"><div class="field"><label for="certEmployee">Karyawan</label><select id="certEmployee" name="employee">${data.employees.map(e=>`<option value="${e.id}" ${e.id===employee?'selected':''}>${esc(e.name)} · ${esc(siteName(e.site))}</option>`).join('')}</select></div><div class="field"><label for="certTraining">Training / sertifikasi</label><select id="certTraining" name="training" onchange="updateCertificateValidity()">${selectableTrainings(training).map(t=>`<option value="${t.id}" ${t.id===selected?.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label for="certIssued">Tanggal mulai berlaku / selesai training</label><input id="certIssued" name="issued" type="date" required value="${current?.issued||reference}" max="${reference}"></div><div class="field"><label for="certExpires">Tanggal kedaluwarsa pada dokumen</label><input id="certExpires" name="expires" type="date" ${selected?.expiryMode==='none'?'disabled':'required'} value="${current?.expires||''}"><small id="certValidityNote" style="font-size:10px;color:#81917a">${selected?.expiryMode==='none'?'Training ini tidak memiliki tanggal kedaluwarsa.':'Isi berdasarkan dokumen asli. Masa berlaku master adalah acuan.'}</small></div></div><label style="display:flex;gap:9px;align-items:start;font-size:11px;color:#74886b;margin:22px 0;line-height:1.7"><input type="checkbox" required name="verified"> Saya telah memeriksa bukti, jenis training, dan tanggal pada dokumen asli.</label><button class="btn primary">${icon('check',14)} Simpan hasil verifikasi</button></form>`)}
function updateCertificateValidity(){const selected=tr(document.getElementById('certTraining').value),input=document.getElementById('certExpires'),none=selected?.expiryMode==='none';input.disabled=none;input.required=!none;document.getElementById('certValidityNote').textContent=none?'Training ini tidak memiliki tanggal kedaluwarsa.':'Isi berdasarkan dokumen asli. Masa berlaku master adalah acuan.'}
function saveCertificate(planId){const f=new FormData(document.getElementById('certForm')),issued=f.get('issued'),employee=f.get('employee'),training=f.get('training'),t=tr(training),expires=t?.expiryMode==='none'?null:f.get('expires');if(!t||!emp(employee)||!f.get('verified'))return toast('Periksa karyawan, training, dan konfirmasi verifikasi.');if(!issued||issued>reference||(t.expiryMode!=='none'&&(!expires||expires<issued)))return toast('Periksa tanggal mulai berlaku dan tanggal kedaluwarsa.');if(planId){const p=data.plans.find(p=>p.id===planId);if(p&&(p.employee!==employee||p.training!==training))return toast('Karyawan dan training harus sesuai rencana yang diverifikasi.')}data.certs.push({id:Date.now(),employee,training,expires,issued,verified:true});data.plans.forEach(p=>{if(p.employee===employee&&p.training===training&&p.status!=='completed'&&(!expires||expires>=reference))p.status='completed'});save();closeModal();render();toast('Hasil verifikasi tersimpan. Alert dan pemenuhan site diperbarui.')}
function generatePlan(){const needs=getNeeds(planYear);let added=0;needs.forEach(n=>{const e=emp(n.employee);if(siteFilter!=='all'&&e.site!==siteFilter)return;const existing=data.plans.find(p=>p.year===planYear&&p.employee===n.employee&&p.training===n.training);if(existing){existing.sources=[...new Set([...existing.sources,...n.sources])];return}let d=parseDate(n.trigger);if(d.getFullYear()<planYear)d=new Date(planYear,0,1);if(d.getFullYear()>planYear)return;data.plans.push({...n,id:'p'+planYear+n.employee+n.training,year:planYear,target:iso(d).slice(0,7),status:'outstanding'});added++});save();render();toast(added?`${added} kebutuhan ditambahkan ke plan ${planYear}.`:'Plan sudah mencakup seluruh kebutuhan pada filter ini. Tidak ada duplikasi.')}
function changeTarget(id,target){const p=data.plans.find(p=>p.id===id);if(!/^\d{4}-\d{2}$/.test(target)||Number(target.slice(0,4))!==p.year){toast('Target bulan harus berada dalam tahun rencana.');render();return}p.target=target;save();toast('Target bulan diperbarui.')}
function schedulePlan(id){data.plans.find(p=>p.id===id).status='planned';save();render();toast('Status menjadi dijadwalkan. Alert tetap terbuka sampai bukti terverifikasi.')}
function toast(message){clearTimeout(window.toastTimeout);document.getElementById('toastRoot').innerHTML=`<div class="toast">${icon('check',15)} &nbsp;${esc(message)}</div>`;window.toastTimeout=setTimeout(()=>document.getElementById('toastRoot').innerHTML='',4200)}
function csvDownload(name,rows){const content='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Laporan CSV berhasil dibuat.')}
function exportData(){csvDownload('People_Development_Laporan.csv',[['NIK','Nama','Posisi','Site','Sertifikasi','Dasar Kebutuhan','Batas Selesai','Status'],...currentNeeds().map(n=>{const e=emp(n.employee);return [e.id,e.name,e.position,siteName(e.site),tr(n.training).name,n.sources.join(' + '),n.due,n.type]})])}
function exportPlan(){const list=data.plans.filter(p=>p.year===planYear&&(siteFilter==='all'||emp(p.employee).site===siteFilter));if(!list.length)return toast('Generate plan terlebih dahulu sebelum export.');csvDownload('People_Development_Plan_'+planYear+'.csv',[['NIK','Nama','Site','Training','Dasar Kebutuhan','Target Bulan','Status'],...list.map(p=>[p.employee,emp(p.employee).name,siteName(emp(p.employee).site),tr(p.training).name,p.sources.join(' + '),p.target,p.status])])}
function resetDemo(){showModal('Pulihkan data awal?',`<p>Perubahan mapping, karyawan tambahan, sertifikat, dan plan di browser ini akan diganti dengan data awal dari Excel, termasuk daftar penerima email dan preferensi.</p>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="localStorage.removeItem('people-development-excel-v1');localStorage.removeItem('people-development-excel-v1-before-import');location.reload()">Pulihkan data awal</button>`)}
// XLSX exchange runs locally in the browser; no uploaded workbook leaves the device.
const PD_STORE='people-development-excel-v1',PD_BACKUP=PD_STORE+'-before-import';
const makeId=prefix=>prefix+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const emailValid=value=>/^[^\s@<>;,]+@[^\s@<>;,]+\.[^\s@<>;,]+$/.test(String(value))&&String(value).length<=254;
let pendingImport=null,importBusy=false;
const activeBadge=on=>pill(on?'active':'optional',on?'Aktif':'Nonaktif');
function recipientsMarkup(){return data.settings.recipients.length?data.settings.recipients.map((r,i)=>`<div class="switch-row" style="gap:10px"><div style="flex:1;min-width:0"><strong style="font-size:12px;overflow-wrap:anywhere">${esc(r.email)}</strong><small>${r.active?'Menerima alert saat layanan email terhubung':'Tidak masuk daftar penerima aktif'}</small></div><input class="toggle" type="checkbox" aria-label="Aktifkan penerima ${esc(r.email)}" ${r.active?'checked':''} onchange="toggleRecipient(${i},this.checked)"><button class="icon-button" aria-label="Hapus penerima ${esc(r.email)}" onclick="removeRecipient(${i})">${icon('close',13)}</button></div>`).join(''):'<div class="empty" style="padding:20px">Belum ada penerima email.</div>'}
function addRecipient(){const input=document.getElementById('recipientEmail'),email=input.value.trim();if(!emailValid(email)){input.reportValidity();return toast('Masukkan satu alamat email yang valid.')}if(data.settings.recipients.some(r=>r.email.toLowerCase()===email.toLowerCase()))return toast('Email sudah ada dalam daftar penerima.');data.settings.recipients.push({email,active:true});save();render();toast('Penerima email ditambahkan. Pengiriman email belum terhubung.')}
function toggleRecipient(index,active){if(data.settings.recipients[index]){data.settings.recipients[index].active=active;save();render()}}
function removeRecipient(index){data.settings.recipients.splice(index,1);save();render();toast('Penerima dihapus dari daftar.')}
function settingsPage(){return heading('PENGATURAN','Pengaturan','Kelola penerima alert dan preferensi aplikasi.')+`<div class="grid"><section class="card"><div class="card-head"><div><h2>Notifikasi & penerima email</h2><p>${data.settings.recipients.filter(r=>r.active).length} penerima aktif</p></div>${icon('bell',20)}</div><div class="card-body"><div class="switch-row"><div><strong style="font-size:12px">Alert dashboard</strong><small>Aktif · mulai H-6 bulan kalender</small></div>${pill('active','Aktif')}</div><div class="switch-row"><div><strong style="font-size:12px">Notifikasi email</strong><small>Daftar penerima tersimpan. Pengiriman email belum terhubung.</small></div><input class="toggle" type="checkbox" aria-label="Preferensi notifikasi email" ${data.settings.enabled?'checked':''} onchange="data.settings.enabled=this.checked;save();toast('Preferensi tersimpan. Pengiriman email belum terhubung.')"></div><form onsubmit="event.preventDefault();addRecipient()" style="margin-top:20px"><div class="field"><label for="recipientEmail">Tambah penerima email</label><div class="actions" style="align-items:stretch"><input id="recipientEmail" type="email" required maxlength="254" placeholder="nama@perusahaan.co.id" style="min-width:0;flex:1"><button class="btn primary" type="submit">${icon('plus',13)} Tambah</button></div></div></form>${recipientsMarkup()}</div></section><section class="card"><div class="card-head"><div><h2>Data & pengelolaan</h2><p>Data tersimpan di browser masing-masing</p></div>${icon('shield',20)}</div><div class="card-body"><p style="font-size:12px;color:#84957d;line-height:1.9">Download seluruh data ke Excel untuk pencadangan atau pembaruan. Upload menggunakan template dari aplikasi, lalu periksa pratinjau sebelum menerapkan perubahan.</p><button class="btn primary" style="margin-top:18px" onclick="navigate('dataExchange')">${icon('download',14)} Import / Export Excel</button><div class="rule-note" style="margin-top:20px"> Tanggal berlaku hasil perhitungan perlu diverifikasi terhadap dokumen asli.</div><button class="btn" onclick="resetDemo()">Pulihkan data awal</button></div></section></div>`}
const EXCHANGE_HEADERS={
 Posisi:['ID_Posisi','Nama_Posisi','Aktif'],
 Training:['ID_Training','Nama_Training','Kode','Jenis','Masa_Berlaku','Durasi_Bulan','Penyegaran_Bulan','Keterangan','Aktif'],
 Site:['ID_Site','Nama_Site','Wilayah'],
 Karyawan:['NRP','Nama','ID_Posisi','ID_Site','Tanggal_Masuk','Status_Karyawan'],

if(name==='AturanSite'){const t=refTraining(r.ID_Training),sid=importText(r.ID_Site)||'*';if(sid!=='*'&&!site(sid))throw Error('ID_Site tidak ditemukan.');const candidates=importText(r.ID_Posisi_Kandidat).split(';').map(x=>x.trim()).filter(Boolean).map(id=>refPosition(id).name);if(!candidates.length)throw Error('ID_Posisi_Kandidat wajib diisi.');if(new Set(candidates).size!==candidates.length)throw Error('Posisi kandidat duplikat.');if(candidate.siteRules.some(x=>x.id!==key&&(x.site||'*')===sid&&x.training===t.id))throw Error('Aturan training untuk cakupan site ini sudah ada.');item={...old,id:key,site:sid==='*'?null:sid,training:t.id,position:old?.position||'Posisi sesuai mapping',positions:candidates,minimum:importInteger(r.Minimum_Orang,'Minimum_Orang',1,1000),active:legacySiteHeaders?(old?.active!==false):importBoolean(r.Aktif,'Aktif')};if(sid==='*'&&old&&!('site' in old))delete item.site;}

async function previewWorkbook(){if(importBusy)return;const file=document.getElementById('importWorkbook')?.files?.[0],feedback=document.getElementById('importFeedback');if(!file)return toast('Pilih file Excel terlebih dahulu.');if(!/\.xlsx$/i.test(file.name)||file.size>20*1024*1024)return toast('Gunakan file .xlsx dengan ukuran maksimal 20 MB.');importBusy=true;const button=document.getElementById('previewImportButton');button.disabled=true;button.textContent='Memeriksa file…';feedback.textContent='';try{const workbook=await parseXlsx(await file.arrayBuffer());pendingImport=buildImport(workbook);showImportPreview(file.name)}catch(e){pendingImport=null;feedback.textContent=e.message;toast('File belum dapat diproses. Periksa keterangan pada halaman.')}finally{importBusy=false;if(button.isConnected){button.disabled=false;button.innerHTML=icon('search',14)+' Periksa & pratinjau'}}}
function showImportPreview(filename){const p=pendingImport,totals=p.summary.reduce((a,s)=>({added:a.added+s.added,updated:a.updated+s.updated,unchanged:a.unchanged+s.unchanged}),{added:0,updated:0,unchanged:0});showModal('Pratinjau import Excel',`<p>${esc(filename)}<br>${totals.added} baris baru · ${totals.updated} perubahan · ${totals.unchanged} baris tetap.</p><div class="table-wrap"><table><thead><tr><th>Data</th><th>Baru</th><th>Berubah</th><th>Tetap</th></tr></thead><tbody>${p.summary.map(s=>`<tr><td>${EXCHANGE_LABELS[s.sheet]}</td><td>${s.added}</td><td>${s.updated}</td><td>${s.unchanged}</td></tr>`).join('')}</tbody></table></div>${p.errors.length?`<div style="margin-top:20px;color:#b36d60"><h3>${p.errors.length} kesalahan perlu diperbaiki</h3><div style="font-size:11px;line-height:1.9;margin-top:10px;max-height:180px;overflow:auto">${p.errors.slice(0,100).map(e=>`<div>${esc(e.sheet)}${e.row?' · baris '+e.row:''}: ${esc(e.message)}</div>`).join('')}${p.errors.length>100?'<div>Menampilkan 100 kesalahan pertama.</div>':''}</div></div>`:`<div class="rule-note" style="margin-top:20px">Tidak ada penghapusan otomatis. ${p.verifiedChanges?p.verifiedChanges+' baris mengubah bukti menjadi terverifikasi.':''} Pencadangan dibuat sebelum import diterapkan.</div><label style="display:flex;gap:9px;font-size:11px;line-height:1.7;color:#708765"><input id="confirmImport" type="checkbox"> Saya sudah memeriksa perubahan${p.verifiedChanges?' dan dokumen untuk baris terverifikasi':''}.</label>`}`,`<button class="btn" onclick="pendingImport=null;closeModal()">Batal</button><button class="btn primary" ${p.errors.length?'disabled style="opacity:.5;cursor:not-allowed"':''} onclick="applyWorkbookImport()">Terapkan import</button>`)}
function applyWorkbookImport(){const p=pendingImport;if(!p||p.errors.length)return;if(!document.getElementById('confirmImport')?.checked)return toast('Konfirmasikan pemeriksaan perubahan terlebih dahulu.');if(JSON.stringify(data)!==p.baseSnapshot){pendingImport=null;closeModal();return toast('Data telah berubah. Periksa workbook kembali sebelum import.')}try{localStorage.setItem(PD_BACKUP,JSON.stringify(data));localStorage.setItem(PD_STORE,JSON.stringify(p.candidate));data=p.candidate;syncMasters();pendingImport=null;siteFilter='all';closeModal();render();toast('Import berhasil. Semua perubahan diterapkan sekaligus.')}catch(e){toast('Import belum diterapkan: penyimpanan browser tidak tersedia atau penuh.')}}
function undoLastImport(){let previous;try{previous=localStorage.getItem(PD_BACKUP)}catch(e){return toast('Penyimpanan browser tidak tersedia.')}if(!previous)return toast('Belum ada pencadangan import yang dapat dipulihkan.');showModal('Batalkan import terakhir?',`<p>Data akan kembali ke kondisi sebelum import terakhir. Perubahan setelah import tersebut juga akan dibatalkan.</p>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="confirmUndoImport()">Pulihkan sebelum import</button>`)}
